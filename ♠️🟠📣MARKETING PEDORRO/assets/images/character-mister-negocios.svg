<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-pat-mn" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0B0B0B" fill-opacity="0.15" />
    </pattern>
    <filter id="shadow-mn" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0B0B0B" />
    </filter>
  </defs>

  <rect x="8" y="8" width="384" height="384" fill="#F4F1E9" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-mn)" />
  <rect x="8" y="8" width="384" height="384" fill="url(#dot-pat-mn)" />

  <!-- Avatar Box: Luxury & Vanity Gold Foil Simulation -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="200" height="200" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-mn)" />
    <!-- Suit / Sunglasses Silhouette -->
    <path d="M 50 180 L 70 120 L 130 120 L 150 180 Z" fill="#0B0B0B" />
    <polygon points="100,120 85,150 100,175 115,150" fill="#ED1C24" stroke="#0B0B0B" stroke-width="2" />
    <!-- Giant Sunglasses -->
    <rect x="55" y="85" width="40" height="22" rx="4" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="2" />
    <rect x="105" y="85" width="40" height="22" rx="4" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="2" />
    <line x1="95" y1="94" x2="105" y2="94" stroke="#0B0B0B" stroke-width="3" />
    <!-- Glare in glasses -->
    <line x1="60" y1="90" x2="75" y2="103" stroke="#FFFFFF" stroke-width="2" />
    <line x1="110" y1="90" x2="125" y2="103" stroke="#FFFFFF" stroke-width="2" />
    <!-- Fake Gold Coin Badge -->
    <circle cx="160" cy="40" r="20" fill="#FF7900" stroke="#0B0B0B" stroke-width="3" />
    <text x="160" y="48" font-family="'Montserrat', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>

  <!-- Name & Archetype Banner -->
  <rect x="25" y="295" width="350" height="42" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="3" filter="url(#shadow-mn)" />
  <text x="200" y="323" font-family="'Montserrat', Impact, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    MISTER NEGOCIOS
  </text>
  <text x="200" y="360" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#0B0B0B" text-anchor="middle">
    ARQUETIPO: EL ÉXITO SUPERFICIAL Y EL HUMO
  </text>
  <text x="200" y="378" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#ED1C24" text-anchor="middle">
    [ ASSET CANÓNICO OFICIAL PENDIENTE ]
  </text>
</svg>
