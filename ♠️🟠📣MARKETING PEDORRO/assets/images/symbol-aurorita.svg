<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="shadow-aurora" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0B0B0B" />
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-aurora)" />
  
  <!-- Bicycle Wheels -->
  <circle cx="110" cy="180" r="50" fill="#F4F1E9" stroke="#0B0B0B" stroke-width="5" />
  <circle cx="290" cy="180" r="50" fill="#F4F1E9" stroke="#0B0B0B" stroke-width="5" />
  <circle cx="110" cy="180" r="8" fill="#129FE6" stroke="#0B0B0B" stroke-width="2" />
  <circle cx="290" cy="180" r="8" fill="#129FE6" stroke="#0B0B0B" stroke-width="2" />
  
  <!-- Spokes -->
  <line x1="110" y1="130" x2="110" y2="230" stroke="#0B0B0B" stroke-width="2" />
  <line x1="60" y1="180" x2="160" y2="180" stroke="#0B0B0B" stroke-width="2" />
  <line x1="290" y1="130" x2="290" y2="230" stroke="#0B0B0B" stroke-width="2" />
  <line x1="240" y1="180" x2="340" y2="180" stroke="#0B0B0B" stroke-width="2" />

  <!-- Frame (Aurorita classic folding frame) -->
  <polygon points="110,180 200,180 170,110" fill="none" stroke="#29AF32" stroke-width="6" />
  <polygon points="200,180 270,110 290,180" fill="none" stroke="#29AF32" stroke-width="6" />
  <line x1="170" y1="110" x2="270" y2="110" stroke="#29AF32" stroke-width="6" />
  
  <!-- Seat & Handlebars -->
  <rect x="150" y="95" width="40" height="12" rx="4" fill="#0B0B0B" />
  <path d="M 270 110 L 260 70 L 280 60" fill="none" stroke="#0B0B0B" stroke-width="5" />

  <!-- Slogan Banner -->
  <rect x="40" y="235" width="320" height="34" fill="#29AF32" stroke="#0B0B0B" stroke-width="3" filter="url(#shadow-aurora)" />
  <text x="200" y="258" font-family="'Montserrat', Impact, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    🚲 LA AURORITA: «NO CORRER. AVANZAR.»
  </text>
</svg>
