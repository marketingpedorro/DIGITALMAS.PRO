<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="shadow-baul" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0B0B0B" />
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="284" fill="#F4F1E9" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-baul)" />
  
  <!-- Baúl Box -->
  <rect x="60" y="90" width="280" height="150" rx="8" fill="#FF7900" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-baul)" />
  <!-- Baúl Lid -->
  <path d="M 50 90 Q 200 40 350 90 Z" fill="#E56A00" stroke="#0B0B0B" stroke-width="4" />
  <line x1="60" y1="90" x2="340" y2="90" stroke="#0B0B0B" stroke-width="4" />
  
  <!-- Metallic Bands & Lock -->
  <rect x="100" y="90" width="20" height="150" fill="#0B0B0B" />
  <rect x="280" y="90" width="20" height="150" fill="#0B0B0B" />
  <circle cx="200" cy="130" r="22" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="3" />
  <circle cx="200" cy="130" r="8" fill="#ED1C24" />
  
  <!-- Idea Bulb Sticking Out -->
  <path d="M 230 65 Q 245 40 260 65 Q 255 75 245 75 Z" fill="#129FE6" stroke="#0B0B0B" stroke-width="3" />
  <line x1="245" y1="30" x2="245" y2="20" stroke="#ED1C24" stroke-width="3" />
  <line x1="265" y1="35" x2="275" y2="25" stroke="#ED1C24" stroke-width="3" />

  <!-- Badge / Tag -->
  <rect x="70" y="190" width="260" height="34" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="3" transform="rotate(-1 200 207)" />
  <text x="200" y="213" font-family="'Montserrat', Impact, sans-serif" font-weight="900" font-size="14" fill="#0B0B0B" text-anchor="middle" letter-spacing="1">
    🧳 BAÚL DE LAS IDEASURAS
  </text>
  <text x="200" y="270" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#ED1C24" text-anchor="middle">
    «NO ES DESCARTARLA. ES DECIRLE: NO AHORA.»
  </text>
</svg>
