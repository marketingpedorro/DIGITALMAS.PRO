<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-pat-of" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#129FE6" fill-opacity="0.3" />
    </pattern>
    <filter id="shadow-of" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0B0B0B" />
    </filter>
  </defs>

  <rect x="8" y="8" width="384" height="384" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-of)" />
  <rect x="8" y="8" width="384" height="384" fill="url(#dot-pat-of)" />

  <!-- Structured Clarity Lines -->
  <line x1="30" y1="40" x2="370" y2="40" stroke="#129FE6" stroke-width="2" stroke-dasharray="6,4" />
  <line x1="30" y1="270" x2="370" y2="270" stroke="#129FE6" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Avatar Box -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="200" height="200" fill="#F4F1E9" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-of)" />
    <!-- Guide / Compass Clarity Emblem -->
    <circle cx="100" cy="100" r="60" fill="#129FE6" stroke="#0B0B0B" stroke-width="3" />
    <!-- Compass Pointer / Direction -->
    <polygon points="100,55 115,100 100,90 85,100" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="2" />
    <polygon points="100,145 115,100 100,110 85,100" fill="#29AF32" stroke="#0B0B0B" stroke-width="2" />
    <!-- Eye / Direct Look -->
    <circle cx="100" cy="100" r="10" fill="#0B0B0B" />
    <circle cx="103" cy="97" r="3" fill="#FFFFFF" />
  </g>

  <!-- Name & Archetype Banner -->
  <rect x="25" y="295" width="350" height="42" fill="#129FE6" stroke="#0B0B0B" stroke-width="3" filter="url(#shadow-of)" transform="rotate(1 200 316)" />
  <text x="200" y="323" font-family="'Montserrat', Impact, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    OFELTIN
  </text>
  <text x="200" y="360" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#0B0B0B" text-anchor="middle">
    ARQUETIPO: LA GUÍA, EL MÉTODO Y LA CLARIDAD
  </text>
  <text x="200" y="378" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#129FE6" text-anchor="middle">
    [ ASSET CANÓNICO OFICIAL PENDIENTE ]
  </text>
</svg>
