<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="dot-pat-se" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FF7900" fill-opacity="0.3" />
    </pattern>
    <filter id="shadow-se" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#0B0B0B" />
    </filter>
  </defs>

  <rect x="8" y="8" width="384" height="384" fill="#F4F1E9" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-se)" />
  <rect x="8" y="8" width="384" height="384" fill="url(#dot-pat-se)" />

  <!-- Dynamic Chaos Lines -->
  <line x1="30" y1="60" x2="110" y2="40" stroke="#ED1C24" stroke-width="3" />
  <line x1="320" y1="70" x2="370" y2="100" stroke="#ED1C24" stroke-width="3" />
  <line x1="40" y1="320" x2="90" y2="350" stroke="#0B0B0B" stroke-width="3" />

  <!-- Character Icon Silhouette / Avatar Box -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="200" height="200" fill="#FFFFFF" stroke="#0B0B0B" stroke-width="4" filter="url(#shadow-se)" />
    <!-- Distressed Expression Symbolism -->
    <circle cx="100" cy="85" r="50" fill="#FF7900" stroke="#0B0B0B" stroke-width="3" />
    <!-- Spiral / Chaos Eyes -->
    <path d="M 80 80 Q 85 70 90 80 T 80 90" fill="none" stroke="#0B0B0B" stroke-width="3" />
    <path d="M 110 80 Q 115 70 120 80 T 110 90" fill="none" stroke="#0B0B0B" stroke-width="3" />
    <path d="M 85 110 Q 100 98 115 110" fill="none" stroke="#0B0B0B" stroke-width="3" />
    <!-- Sweat Drops -->
    <path d="M 155 70 Q 165 75 160 85 Q 150 85 155 70 Z" fill="#129FE6" stroke="#0B0B0B" stroke-width="2" />
    <!-- Exclamation badge -->
    <circle cx="170" cy="30" r="18" fill="#ED1C24" stroke="#0B0B0B" stroke-width="3" />
    <text x="170" y="38" font-family="'Montserrat', Impact, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">!</text>
  </g>

  <!-- Name & Archetype Banner -->
  <rect x="25" y="295" width="350" height="42" fill="#FF7900" stroke="#0B0B0B" stroke-width="3" filter="url(#shadow-se)" transform="rotate(-1 200 316)" />
  <text x="200" y="323" font-family="'Montserrat', Impact, sans-serif" font-weight="900" font-size="18" fill="#0B0B0B" text-anchor="middle" letter-spacing="1">
    SR. EMPRENDEDOR
  </text>
  <text x="200" y="360" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12" fill="#0B0B0B" text-anchor="middle">
    ARQUETIPO: EL CAOS Y LA SATURACIÓN
  </text>
  <text x="200" y="378" font-family="'Montserrat', sans-serif" font-weight="600" font-size="10" fill="#ED1C24" text-anchor="middle">
    [ ASSET CANÓNICO OFICIAL PENDIENTE ]
  </text>
</svg>
