    :root{color-scheme:dark;font-family:Montserrat,system-ui,sans-serif;background:#001e10;color:#fff8e7}

    body{min-width:320px;min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,rgba(248,182,47,.15),transparent 28rem),linear-gradient(180deg,#001e10,#012b17)}

    .code{color:#f8b62f;font-size:.72rem;font-weight:900;letter-spacing:.16em}
    h1{max-width:590px;margin:10px 0 14px;font-size:clamp(2.2rem,7vw,4.5rem);line-height:.96;letter-spacing:-.055em}
    p{max-width:560px;margin:0;color:rgba(255,248,231,.72);font-size:clamp(.95rem,2vw,1.1rem);line-height:1.65}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:12px;font-weight:900;text-decoration:none}
    .primary{background:#f8b62f;color:#012b17}
    .primary:hover{background:#ffc64d}
    .secondary{border:1px solid rgba(255,248,231,.26);color:#fff8e7;background:rgba(255,255,255,.035)}
    a:focus-visible{outline:3px solid #fff8e7;outline-offset:4px}
    small{display:block;margin-top:22px;color:rgba(255,248,231,.48);font-size:.7rem}
    @media(max-width:640px){body{padding:14px}main{grid-template-columns:1fr;text-align:center;border-radius:24px}img{width:min(72vw,230px);margin:auto}.actions{flex-direction:column}.actions a{width:100%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>

  <main>
