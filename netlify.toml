[build]
  base = "Kixiki-Lanches"
  publish = "public"
  command = "npm run netlify:build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/kixiki.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/control/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/dono/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/workspace"
  to = "/.netlify/functions/workspace"
  status = 200

[[redirects]]
  from = "/api/kixiki-owner"
  to = "/.netlify/functions/kixiki-owner"
  status = 200

[[redirects]]
  from = "/api/kixiki-public"
  to = "/.netlify/functions/kixiki-public"
  status = 200

[[redirects]]
  from = "/api/kixiki-events"
  to = "/.netlify/functions/kixiki-events"
  status = 200

[[redirects]]
  from = "/api/kixiki-metrics"
  to = "/.netlify/functions/kixiki-metrics"
  status = 200
